# 把本文件复制到 VPS 上与 src/ 同级后再执行：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 注意：构建上下文是仓库根目录（因为 Rc.Relay 依赖 Rc.Protocol），
# 所以 compose 文件里 context: .. 是相对于 deploy/ 目录解析的。

services:
  rcrelay:
    build:
      context: ..
      dockerfile: src/Rc.Relay/Dockerfile
    image: rcrelay:latest
    container_name: rcrelay
    restart: unless-stopped
    # 只绑定本机，由前面的 Caddy 终结 TLS
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - Relay__Token=CHANGE_ME_STRONG_RANDOM
      - Kestrel__Endpoints__Http__Url=http://0.0.0.0:8080
      - Logging__LogLevel__Default=Information
